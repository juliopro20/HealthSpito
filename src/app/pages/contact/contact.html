<section class="contact">
  <div class="contact-hero">
    <h1>Contact Us</h1>
    <p>We are here to help</p>
    <div class="hero-text">
      @for (item of contectText; track $index) {
        <div>
          <p>{{ item.text }}</p>
        </div>
      }
    </div>
  </div>

  <div class="contact-form">
    <h2>Fill out the form with your necessary <br> information </h2>

    <form action="">
        <div>
            <input type="text" placeholder="Full Name" required>
            <input type="text" placeholder="Email Address" required>
        </div>
         <div>
            <input type="text" placeholder="Select Country" required>
            <input type="tel" placeholder="Phone Number" required>
        </div>
        <textarea name="" id="contact-textarea1" placeholder="Subject"></textarea> <br>
        <textarea name="" id="contact-textarea2" placeholder="Message"></textarea> <br>

        <button type="submit">Submit</button>
    </form>
  </div>
</section>

<app-footer></app-footer>
